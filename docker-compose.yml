version: '3.8'

services:
  realtime-rag:
    build:
      context: .
      dockerfile: Dockerfile
    image: realtime-rag-engine:latest
    container_name: realtime_rag_engine
    restart: always
    ports:
      - "8080:8080"
    environment:
      - RAG_DB_PATH=/data/rag_vectors.db
    volumes:
      - rag_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  rag_data:
